name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sfi
          POSTGRES_PASSWORD: sfi_test_password
          POSTGRES_DB: sfi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sfi -d sfi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/api
    env:
      SFI_DATABASE_URL: postgresql+asyncpg://sfi:sfi_test_password@localhost:5432/sfi_ci
      SFI_JWT_SECRET_KEY: ci-only-secret-key-that-is-long-enough-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Smoke test PostgreSQL migrations
        run: alembic upgrade head
      - name: Verify migration revision
        run: alembic current
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm --filter @sfi/web build
