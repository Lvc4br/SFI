name: CI
on:
  push:
    branches: [main, "feat/**", "feature/**"]
  pull_request:
    branches: [main, "feature/**"]
  workflow_dispatch:

# Avoid wasting runner minutes when several commits land on the same branch.
concurrency:
  group: sfi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sfi/web build

  postgres-financial-precision:
    name: PostgreSQL financial precision
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sfi
          POSTGRES_PASSWORD: sfi-test-only
          POSTGRES_DB: sfi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sfi -d sfi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: services/api
    env:
      SFI_TEST_POSTGRES_URL: postgresql+asyncpg://sfi:sfi-test-only@127.0.0.1:5432/sfi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify Numeric(18,2) persistence and overflow on PostgreSQL
        run: pytest -q tests/test_postgres_precision.py

  backup-automation-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API and test dependencies
        run: python -m pip install --upgrade pip; pip install -e ".[dev]"
      - name: Test Windows DPAPI and automatic backup scheduler
        run: pytest -q tests/test_backup_automation.py

  backup-integrity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test backup checksum integrity (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\test-backup-integrity.ps1

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      SFI_E2E_BROWSER: ${{ matrix.browser }}
      SFI_DATABASE_URL: sqlite+aiosqlite:////tmp/sfi-e2e.db
      SFI_JWT_SECRET_KEY: sfi-e2e-only-secret-key-not-for-production-2026
      SFI_CORS_ORIGINS: http://127.0.0.1:5173
      VITE_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install API and browser test dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install browser engine
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare isolated SQLite database
        working-directory: services/api
        run: python scripts/create_e2e_db.py
      - name: Start API and Web servers
        run: |
          nohup uvicorn sfi_api.main:app --host 127.0.0.1 --port 8000 > /tmp/sfi-api.log 2>&1 &
          nohup pnpm --filter @sfi/web dev -- --host 127.0.0.1 > /tmp/sfi-web.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request

          endpoints = [
              "http://127.0.0.1:8000/api/v1/health/ready",
              "http://127.0.0.1:5173",
          ]
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  for endpoint in endpoints:
                      with urllib.request.urlopen(endpoint, timeout=3) as response:
                          if response.status != 200:
                              raise RuntimeError(f"{endpoint}: HTTP {response.status}")
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("API/Web did not become ready; inspect /tmp/sfi-api.log and /tmp/sfi-web.log")
          PY
        working-directory: services/api
      - name: Run browser-based financial journey
        working-directory: services/api
        run: python -m pytest tests/e2e/test_web_journey.py -m e2e -q
      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sfi-e2e-logs-${{ matrix.browser }}
          path: |
            /tmp/sfi-api.log
            /tmp/sfi-web.log
          if-no-files-found: ignore
