name: Desktop

on:
  push:
    branches: [main, "feat/**", "feature/**"]
  pull_request:
    branches: [main, "feature/**"]
  workflow_dispatch:

concurrency:
  group: sfi-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-installer:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile
      - name: Install and prepare bundled OCR engine
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $ocr = "C:\Program Files\Tesseract-OCR"
          if (!(Test-Path "$ocr\tesseract.exe")) { throw "Tesseract was not installed at the expected path." }
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/por.traineddata" -OutFile "$ocr\tessdata\por.traineddata"
          & "$ocr\tesseract.exe" --list-langs
      - name: Build the bundled local API sidecar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install ./services/api
          pyinstaller --noconfirm --clean --onefile --name sfi-api --paths services/api/src --add-data "services/api/alembic.ini;." --add-data "services/api/migrations;migrations" --collect-all alembic --collect-all sqlalchemy --collect-all sfi_api --collect-all uvicorn --collect-all fastapi --collect-all pydantic_settings --collect-all pydantic --collect-all pydantic_core --collect-all aiosqlite --collect-all asyncpg --collect-all greenlet --collect-all tzdata --collect-all pwdlib --collect-all argon2 --collect-all jwt --collect-all pypdfium2 --collect-all PIL --add-data "C:\Program Files\Tesseract-OCR;ocr" services/api/src/sfi_api/desktop_runtime.py
      - name: Smoke-test packaged local API
        shell: powershell
        run: .\\scripts\\test-desktop-sidecar.ps1 -ExecutablePath .\\dist\\sfi-api.exe
      - name: Stage local API resource
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/sfi-api.exe apps/desktop/src-tauri/binaries/sfi-api.exe
      - name: Build NSIS and MSI installers
        working-directory: apps/desktop
        run: pnpm dlx @tauri-apps/cli@^2 build --bundles nsis,msi
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: sfi-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
