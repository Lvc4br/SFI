[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sfi-api"
version = "0.2.0"
description = "API do Sistema Financeiro Inteligente"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "aiosqlite>=0.21,<1.0",
  "alembic>=1.14,<2.0",
  "pwdlib[argon2]>=0.2.1,<1.0",
  "PyJWT>=2.10,<3.0",
  "cryptography>=50.0,<51.0",
  "tzdata>=2024.1",
  "openpyxl>=3.1.5,<4.0",
  "pypdf>=5.0,<7.0",
  "pypdfium2>=4.30,<5.0",
  "Pillow>=11.0,<13.0",
  "reportlab>=4.2,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.11,<1.0",
  "playwright>=1.55,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sfi_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: browser-based end-to-end tests requiring running SFI services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
